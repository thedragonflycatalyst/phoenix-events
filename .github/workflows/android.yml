name: Android app

# Builds an installable test APK of the Phoenix Community app and publishes it
# as the "android-preview" release. Free on public repos; no Expo account needed.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Typecheck and parser tests
        run: |
          npx tsc --noEmit
          npm run -s test:ocr

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Keep APK for the smoke test
        run: cp android/app/build/outputs/apk/release/app-release.apk phoenix-community.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/phoenix-community.apk
          retention-days: 7

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-preview --yes --cleanup-tag || true
          gh release create android-preview phoenix-community.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Phoenix Community – Android test build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Open this page on your Android phone, download phoenix-community.apk, and tap it to install (allow installing from your browser if asked)."

  # Boots an Android emulator, opens every screen and publishes screenshots + log as the "ci-screens" release
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pick a sample event
        run: |
          ID=$(curl -s "https://fkksaivdznqbfsfsagsj.supabase.co/rest/v1/phoenix_events?select=id&status=eq.published&order=starts_at&limit=1" \
            -H "apikey: sb_publishable_ME6Xg1mtUBA4994aC0n6Uw_LKsJDTXu" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          echo "EVENT_ID=$ID" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/smoke.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-screens --yes --cleanup-tag || true
          gh release create ci-screens screens/* --prerelease --target "$GITHUB_SHA" --title "CI screenshots" --notes "Automated emulator screenshots for ${GITHUB_SHA::7}. Not an app download."
