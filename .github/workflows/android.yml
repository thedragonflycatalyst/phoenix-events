name: Android app

# Builds an installable test APK of the Phoenix Community app and publishes it
# as the "android-preview" release. Free on public repos; no Expo account needed.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check for the Play upload key
        env:
          K: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: echo "HAS_UPLOAD_KEY=$([ -n "$K" ] && echo true || echo false)" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci

      - name: Typecheck and parser tests
        run: |
          npx tsc --noEmit
          npm run -s test:ocr

      - name: Stamp version number
        # Every build gets the next number: version 1.0.N, shown in the app and in the download's file name
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.version='1.0.${{ github.run_number }}';j.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      # Google Play bundle, signed with the Phoenix upload key when the repository secrets are set
      # (ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD).
      - name: Build Play Store bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../phoenix-community.aab
          cd ..
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Replace the default debug signature with the upload key
          zip -q -d phoenix-community.aab 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 phoenix-community.aab "$KEY_ALIAS"
          jarsigner -verify phoenix-community.aab | tail -1
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: play-bundle
          path: mobile/phoenix-community.aab
          retention-days: 30

      - name: Keep APK for the smoke test
        run: cp android/app/build/outputs/apk/release/app-release.apk phoenix-community.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/phoenix-community.apk
          retention-days: 7

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp phoenix-community.apk "phoenix-community-v$N.apk"
          NOTES="Version $APP_VERSION, built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Open this page on your Android phone, download the .apk, and tap it to install (allow installing from your browser if asked)."
          # Numbered release for this build, kept so every version has its own link
          gh release create "android-v$N" "phoenix-community-v$N.apk" --prerelease --target "$GITHUB_SHA" \
            --title "Phoenix Community – Android version $N" --notes "$NOTES"
          # Rolling "latest" release whose link never changes
          gh release delete android-preview --yes --cleanup-tag || true
          gh release create android-preview phoenix-community.apk "phoenix-community-v$N.apk" --prerelease --target "$GITHUB_SHA" \
            --title "Phoenix Community – Android test build (latest: version $N)" --notes "$NOTES"
          # Keep only the 10 newest numbered releases
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^android-v' | sort -t v -k2 -n -r | tail -n +11 | xargs -r -I{} gh release delete {} --yes --cleanup-tag

  # Boots an Android emulator, opens every screen and publishes screenshots + log as the "ci-screens" release
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pick a sample event
        run: |
          ID=$(curl -s "https://fkksaivdznqbfsfsagsj.supabase.co/rest/v1/phoenix_events?select=id&status=eq.published&order=starts_at&limit=1" \
            -H "apikey: sb_publishable_ME6Xg1mtUBA4994aC0n6Uw_LKsJDTXu" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          echo "EVENT_ID=$ID" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/smoke.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-screens --yes --cleanup-tag || true
          gh release create ci-screens $(find screens -type f -size +0 | sort) --prerelease --target "$GITHUB_SHA" --title "CI screenshots" --notes "Automated emulator screenshots for ${GITHUB_SHA::7}. Not an app download."
